[project]
name = "backstop-api"
version = "0.1.0"
description = "Backstop HTTP API - tickets, approvals, traces, governance"
requires-python = ">=3.12"
dependencies = [
    "backstop-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstop_api"]

[tool.uv.sources]
backstop-telemetry = { workspace = true }
