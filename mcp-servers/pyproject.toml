[project]
name = "backstop-mcp"
version = "0.1.0"
description = "Backstop MCP servers - the tool plane"
requires-python = ">=3.12"
dependencies = [
    "backstop-domain",
    "mcp>=2.0",
]

[project.scripts]
backstop-mcp-orders = "backstop_mcp.servers.orders:main"
backstop-mcp-shipping = "backstop_mcp.servers.shipping:main"
backstop-mcp-catalog = "backstop_mcp.servers.catalog:main"
backstop-mcp-policy = "backstop_mcp.servers.policy:main"
backstop-mcp-payments = "backstop_mcp.servers.payments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstop_mcp"]

[tool.uv.sources]
backstop-domain = { workspace = true }
