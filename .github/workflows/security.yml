name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits rather than just the tree.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --all-packages --dev
      # uvx runs the auditor in its own ephemeral environment rather than
      # installing it into the environment it is auditing.
      #
      # The workspace's own packages are stripped from the export first. They are
      # local `-e ./path` entries with no PyPI presence, and under --strict
      # pip-audit treats "could not be audited" as a failure - which would fail
      # the build on our own code every time while telling us nothing about the
      # dependencies it exists to check.
      - name: Audit Python dependencies
        run: |
          uv export --no-hashes --no-dev | grep -v '^-e ' > requirements.audit.txt
          uvx pip-audit --strict --requirement requirements.audit.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit Node dependencies
        run: npm audit --audit-level=high

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
