name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commits, not just the tree, so it needs the history.
          fetch-depth: 0

      # Invoked directly rather than through gitleaks-action, which derives a
      # commit range from the push event. That range starts at the first pushed
      # commit's parent, so a push that includes the root commit - a force push
      # after a history rewrite, for instance - asks git for <root>^, gets
      # "unknown revision", and fails having scanned zero bytes. The job goes
      # red, which looks like a finding but is an empty scan: the failure mode
      # of a secret scanner should never be one that is indistinguishable from
      # a hit. Scanning the whole history has no range to get wrong.
      #
      # Pinned by version and checksum, which is stricter than the action's
      # floating @v2 tag.
      - name: Scan every commit for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks.sarif

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --all-packages --dev
      # uvx runs the auditor in its own ephemeral environment rather than
      # installing it into the environment it is auditing.
      #
      # The workspace's own packages are stripped from the export first. They are
      # local `-e ./path` entries with no PyPI presence, and under --strict
      # pip-audit treats "could not be audited" as a failure - which would fail
      # the build on our own code every time while telling us nothing about the
      # dependencies it exists to check.
      - name: Audit Python dependencies
        run: |
          uv export --no-hashes --no-dev | grep -v '^-e ' > requirements.audit.txt
          uvx pip-audit --strict --requirement requirements.audit.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit Node dependencies
        run: npm audit --audit-level=high

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
