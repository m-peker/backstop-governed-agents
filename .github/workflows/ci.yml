name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKSTOP_ENV: ci
  # No provider keys in CI. Anything that needs a live model belongs in the eval
  # workflow, which runs with scoped secrets and a budget ceiling.
  BACKSTOP_LOG_LEVEL: WARNING

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy apps packages mcp-servers

      - name: Test
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: warn

  web:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  task-parity:
    name: Makefile and task.ps1 agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compare target lists
        run: sh scripts/check-task-parity.sh

  compose:
    name: Local plane is valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start data plane
        run: docker compose up -d postgres redis

      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if docker compose ps --format json | grep -q '"Health":"healthy"'; then
              break
            fi
            sleep 2
          done
          docker compose ps

      - name: Extensions and schemas were created
        run: |
          docker compose exec -T postgres psql -U backstop -d backstop -c "\dx" | grep -q vector
          docker compose exec -T postgres psql -U backstop -d backstop -c "\dn" | grep -q audit

      - name: Tear down
        if: always()
        run: docker compose down -v
