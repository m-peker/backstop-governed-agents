[project]
name = "backstop-toolgateway"
version = "0.1.0"
description = "Capability boundary in front of every Backstop tool call"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstop_toolgateway"]
