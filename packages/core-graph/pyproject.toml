[project]
name = "backstop-graph"
version = "0.1.0"
description = "The deterministic resolution graph"
requires-python = ">=3.12"
dependencies = [
    "backstop-guardrails",
    "backstop-llm",
    "backstop-policy",
    "backstop-toolgateway",
    "langgraph>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstop_graph"]

[tool.uv.sources]
backstop-guardrails = { workspace = true }
backstop-llm = { workspace = true }
backstop-policy = { workspace = true }
backstop-toolgateway = { workspace = true }
