[project]
name = "backstop-guardrails"
version = "0.1.0"
description = "Input and output guardrails for untrusted text and model output"
requires-python = ">=3.12"
dependencies = [
    "backstop-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstop_guardrails"]

[tool.uv.sources]
backstop-domain = { workspace = true }
